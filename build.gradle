buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'io.github.cdimascio:dotenv-java:3.2.0'
    }
}
plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.kordamp.gradle.jandex' version '2.3.0'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import io.github.cdimascio.dotenv.Dotenv

group = 'dev.jojofr'
version = '2.5.0'

def dotenv = Dotenv.configure()
        .directory(project.rootDir.absolutePath)
        .ignoreIfMissing().ignoreIfMalformed()
        .load()

def remoteUser = dotenv.get('REMOTE_USER') ?: System.getProperty('user.name')
def remoteHost = dotenv.get('REMOTE_HOST') ?: 'localhost'
def remotePort = dotenv.get('REMOTE_PORT')?.toInteger() ?: 22
def remoteKeyPath = dotenv.get('REMOTE_KEY_PATH')
def remoteIdentity = remoteKeyPath ? file(remoteKeyPath.replace('~', System.getProperty('user.home'))).absolutePath : null

java.toolchain.languageVersion.set(JavaLanguageVersion.of(21))
application.mainClass = 'dev.jojofr.joseta.JosetaBot'

repositories { mavenCentral() }
dependencies {
    implementation('net.dv8tion:JDA:6.6.0') {
        // Optionally disable audio natives to reduce jar size by excluding `opus-java` and `tink`
        exclude module: 'opus-java'
        exclude module: 'tink'
    }
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    implementation 'io.smallrye:jandex:3.6.0'

    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'com.zaxxer:HikariCP:7.1.0'

    implementation platform('org.jdbi:jdbi3-bom:3.54.0')
    implementation 'org.jdbi:jdbi3-core'
    implementation 'org.jdbi:jdbi3-sqlobject'
    implementation 'org.jdbi:jdbi3-postgres'

    implementation 'org.flywaydb:flyway-core:13.7.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.7.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    testImplementation 'org.assertj:assertj-core:3.27.7'
}
jandex { version = '3.6.0' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.compilerArgs << '-parameters' // Enable parameter name retention at runtime, required for the InteractionProcessor & for JDBI arguments
}

def shadowJarTask = tasks.named('shadowJar', ShadowJar)
shadowJarTask.configure {
    dependsOn tasks.named('jandex')
    archiveFileName = 'JosetaBot.jar'

    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.FAIL

    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    exclude 'META-INF/*LICENSE*', 'META-INF/*LICENCE*', 'META-INF/README*', 'META-INF/NOTICE*'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '1g'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        showExceptions = true
        exceptionFormat = 'full'
    }
}

tasks.register('uploadServer', Exec) {
    group = 'deployment'
    description = 'Uploads the shadow jar to the remote server via `scp`.'
    dependsOn shadowJarTask

    def archiveFile = shadowJarTask.flatMap { it.archiveFile }
    inputs.files(archiveFile)

    doFirst {
        def cmd = ['sftp', '-P', remotePort.toString()]
        if (remoteIdentity) cmd += ['-i', remoteIdentity]
        cmd += ["${remoteUser}@${remoteHost}:."]

        commandLine cmd

        standardInput = new ByteArrayInputStream("put \"${archiveFile.get().asFile.absolutePath}\"\nexit\n".getBytes())

        println "Uploading ${archiveFile.get().asFile.name} to ${remoteUser}..."
    }
}
